    <meta property="og:title" content="Doc &amp; PDF to Google Forms Converter" />
    <meta property="og:description" content="Konversi soal dokumen Word dan PDF menjadi kuis Google Form secara otomatis dengan AI, dilengkapi dashboard riwayat, editor soal interaktif, ekspor CSV, dan panduan lengkap." />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.svg" />
    <script>
      // Suppress benign Vite HMR WebSocket connection logs and sandbox dev warnings
      (function() {
        function isBenignMessage(msg) {
          if (!msg) return false;
          var str = String(msg);
          return (
            str.indexOf('WebSocket') !== -1 ||
            str.indexOf('websocket') !== -1 ||
            str.indexOf('[vite]') !== -1 ||
            str.indexOf('closed without opened') !== -1
          );
        }

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event.reason;
          var msg = (reason && (reason.message || reason.stack || '' + reason)) || '';
          if (isBenignMessage(msg)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        });

        window.addEventListener('error', function(event) {
          var msg = (event && (event.message || event.error && event.error.message)) || '';
          if (isBenignMessage(msg)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        });

        var originalConsoleError = console.error;
        console.error = function() {
          for (var i = 0; i < arguments.length; i++) {
            var arg = arguments[i];
            var text = (arg && (arg.message || arg.stack)) || String(arg || '');
            if (isBenignMessage(text)) {
              return;
            }
          }
          return originalConsoleError.apply(console, arguments);
        };

        var originalConsoleWarn = console.warn;
        console.warn = function() {
          for (var i = 0; i < arguments.length; i++) {
            var arg = arguments[i];
            var text = (arg && (arg.message || arg.stack)) || String(arg || '');
            if (isBenignMessage(text)) {
              return;
            }
          }
          return originalConsoleWarn.apply(console, arguments);
        };
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
